<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saffron Lane, part 2</title>
<style>
  body { margin: 0; background: #e9e6df; }
  .paper { width: 340px; margin: 0 auto; padding: 24px 20px 32px; background: #fffdf8;
    font: 15px/1.45 "DejaVu Sans Mono", "Courier New", monospace; color: #1b1b1b; }
  h1 { margin: 0; font-size: 20px; text-align: center; letter-spacing: 0.08em; }
  .c { text-align: center; margin: 0; }
  .rule { border-top: 1px dashed #555; margin: 12px 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .row span:first-child { flex: 1; }
  .total { font-weight: bold; font-size: 18px; }
  .small { font-size: 13px; color: #444; }
</style>
</head>
<body>
<div class="paper">
<div class="rule"></div>
<div class="row"><span>Dal makhani</span><span>9.95</span></div>
<div class="row"><span>Saag paneer</span><span>10.95</span></div>
<div class="row"><span>Prawn malabar</span><span>15.95</span></div>
<div class="row"><span>Vegetable biryani</span><span>12.50</span></div>
<div class="row"><span>Pilau rice x3</span><span>10.50</span></div>
<div class="row"><span>Garlic naan x2</span><span>7.90</span></div>
<div class="row"><span>Peshwari naan</span><span>4.25</span></div>
<div class="row"><span>Mango lassi x2</span><span>9.50</span></div>
<div class="row"><span>Kingfisher x4</span><span>22.00</span></div>
<div class="row"><span>Lime soda</span><span>3.50</span></div>
<div class="rule"></div>
<div class="row"><span>Subtotal</span><span>172.30</span></div>
<div class="row"><span>Service 12.5%</span><span>21.54</span></div>
<div class="row total"><span>TOTAL</span><span>193.84</span></div>
<div class="rule"></div>
<p class="c small">Thank you for dining with us.</p>
</div>
</body>
</html>
