<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Corner Larder</title>
<style>
  body { margin: 0; background: #e9e6df; }
  .paper { width: 340px; margin: 0 auto; padding: 24px 20px 32px; background: #fffdf8;
    font: 15px/1.45 "DejaVu Sans Mono", "Courier New", monospace; color: #1b1b1b; }
  h1 { margin: 0; font-size: 20px; text-align: center; letter-spacing: 0.08em; }
  .c { text-align: center; margin: 0; }
  .rule { border-top: 1px dashed #555; margin: 12px 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .row span:first-child { flex: 1; }
  .total { font-weight: bold; font-size: 18px; }
  .small { font-size: 13px; color: #444; }
</style>
</head>
<body>
<div class="paper">
<h1>THE CORNER LARDER</h1>
<p class="c small">2 Mill Lane, Bristol BS1</p>
<p class="c small">Sun 27/09/2026  11:58</p>
<p class="c small">Table 3 · Covers 4</p>
<div class="rule"></div>
<div class="row"><span>Full English x2</span><span>24.00</span></div>
<div class="row"><span>Avocado toast</span><span>9.50</span></div>
<div class="row"><span>Buttermilk pancakes</span><span>8.75</span></div>
<div class="row"><span>Flat white x3</span><span>10.50</span></div>
<div class="row"><span>Fresh orange juice x2</span><span>7.00</span></div>
<div class="rule"></div>
<div class="row"><span>Subtotal</span><span>59.75</span></div>
<div class="row"><span>Brunch club 10%</span><span>-5.98</span></div>
<div class="row total"><span>TOTAL</span><span>53.77</span></div>
<div class="rule"></div>
<p class="c small">No service charge. Tips welcome.</p>
</div>
</body>
</html>
