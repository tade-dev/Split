services:
  - type: web
    name: split-api
    runtime: node
    # FREE FOR NOW. SWITCH TO `starter` BEFORE PAYPAL PAYMENTS GO LIVE (Week B).
    # The spec asks for starter from day one (§4, §9 risk 6): the free tier
    # sleeps after 15 minutes, which drops PayPal webhooks, stops the reconcile
    # and expiry sweeps, and gives judges a ~50s cold start. Free is fine while
    # nothing is paid through it; starter needs a payment method or the
    # hackathon's Render credits.
    plan: free
    region: frankfurt
    rootDir: api
    # --include=dev is required, not optional. NODE_ENV=production below makes
    # npm skip devDependencies, and TypeScript is one, so a plain `npm ci`
    # leaves no tsc and the build dies with "tsc: command not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below is set in the Render dashboard, never in this file.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # The service-account JSON, pasted as a single line.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      # Buyer return and cancel pages. Unset uses the hosted Render URL in code.
      - key: PUBLIC_BASE_URL
        sync: false
      # Hours an unpaid link stays open before it expires. Unset is 168 (7 days).
      - key: ORDER_EXPIRY_HOURS
        sync: false
# Scheduled calls. Each is a POST with header X-Internal-Token: $INTERNAL_TOKEN.
# They are not services in this file, because a cron service is billed on its
# own. .github/workflows/sweeps.yml calls them on this schedule:
#   every 10 min  /v1/internal/workflows/reconcile     paid status a webhook missed
#   hourly        /v1/internal/workflows/expire-sweep  unpaid links past ORDER_EXPIRY_HOURS
#   hourly        /v1/internal/workflows/nudge-sweep   drafts nudges that are due; sends nothing
